
name: AI Usage Declaration
description: Declare AI usage in the development of a chess engine.
title: "[AI Usage Declaration] "
labels:
  - "AI usage"
body:
  - type: markdown
    attributes:
      value: |
        Submit an AI Usage Declaration for a chess engine.
        Select the main category that best describes the development
        process. Subcategories provide additional detail.

        ML training is declared separately and does not automatically
        determine the main AI usage category.

  - type: input
    id: engine_name
    attributes:
      label: Engine name
      description: Name of the chess engine.
      placeholder: e.g. ExampleChess
    validations:
      required: true

  - type: dropdown
    id: issuer_is_author
    attributes:
      label: Is the issuer the author of the engine?
      description: Select whether this is a self-declaration or a third-party declaration.
      options:
        - "Yes — Self-declaration"
        - "No — Third-party declaration"
    validations:
      required: true

  - type: dropdown
    id: ai_usage_category
    attributes:
      label: AI usage category
      description: Select the single category that best describes the engine's development.
      options:
        - "AI-free"
        - "AI-assisted"
        - "AI-coded"
    validations:
      required: true

  - type: checkboxes
    id: ai_assisted_subcategories
    attributes:
      label: AI-assisted — additional details
      description: |
        Select all applicable options if the main category is AI-assisted.
        Leave unchecked for other main categories.
      options:
        - label: "Advice only — explanations, ideas or recommendations"
        - label: "Development assistance — debugging, testing or optimisation"
        - label: "Code assistance — code suggestions or limited code changes"

  - type: checkboxes
    id: ai_coded_subcategories
    attributes:
      label: AI-coded — additional details
      description: |
        Select all applicable options if the main category is AI-coded.
        Leave unchecked for other main categories.
      options:
        - label: "AI-generated snippets — individual code fragments"
        - label: "AI-generated components — substantial or complete engine components"
        - label: "AI-generated engine — the engine was largely generated by AI"

  - type: textarea
    id: ai_systems
    attributes:
      label: AI systems used
      description: |
        Name the AI tools, models or providers used, if known.
        Multiple systems may be listed.
      placeholder: e.g. ChatGPT, Claude, GitHub Copilot, local models
      render: text
    validations:
      required: false

  - type: dropdown
    id: ml_training
    attributes:
      label: ML training
      description: |
        Select the option that best describes machine-learning training
        associated with the engine, including NNUE training.
        This field is independent of the main AI usage category.
      options:
        - "No ML training"
        - "NNUE training"
        - "Other ML training"
        - "Unknown"
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Engine version / release / commit
      description: |
        Optional. Specify a version, release or commit to which
        this declaration applies. Leave blank for a general declaration.
      placeholder: e.g. 1.2.0 or a commit hash / release URL
    validations:
      required: false

  - type: textarea
    id: additional_information
    attributes:
      label: Additional information
      description: |
        Optional. Provide further context, clarifications or details
        about AI usage, ML training or the basis for this declaration.
      placeholder: Additional details...
      render: text
    validations:
      required: false
